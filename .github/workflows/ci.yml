name: Baa-LSP CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa
          ref: 17c5dc31617a7976c2a7d4be30cf6e0faf13ab47
          path: ecosystem/Baa

      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f7fcf8f6d2bf629daf708b3b6028e22c74683ce6
          path: ecosystem/Nazm

      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Takween
          ref: d6a2c629d8a56d2d75c226820fb7a78810f75eae
          path: ecosystem/Takween

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Windows MinGW toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
          $make = Get-Command mingw32-make.exe -ErrorAction SilentlyContinue
          if (-not $gcc -or -not $make) {
            throw 'The Windows runner does not provide GCC and mingw32-make on PATH.'
          }
          @($gcc.Source, $make.Source) |
            ForEach-Object { Split-Path -Parent $_ } |
            Select-Object -Unique |
            ForEach-Object {
              $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }

      - name: Configure Baa and Nazm
        shell: pwsh
        run: |
          $generator = if ($IsWindows) { @('-G', 'MinGW Makefiles') } else { @() }
          cmake -S ecosystem/Baa -B ecosystem/Baa/build -DCMAKE_BUILD_TYPE=Release @generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S ecosystem/Nazm -B ecosystem/Nazm/build -DCMAKE_BUILD_TYPE=Release @generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          cmake --build ecosystem/Baa/build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ecosystem/Nazm/build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Takween with the pinned ecosystem tools
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baa = (Resolve-Path ("ecosystem/Baa/build/baa" + $suffix)).Path
          $nazm = (Resolve-Path ("ecosystem/Nazm/build/nazm" + $suffix)).Path
          $env:BAA_NAZM = $nazm
          $env:NAZM = $nazm
          ./ecosystem/Takween/scripts/build_takween.ps1 `
            -BaaPath $baa `
            -BaaStdlibPath (Resolve-Path 'ecosystem/Baa/stdlib').Path

      - name: Configure
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baa = (Resolve-Path ("ecosystem/Baa/build/baa" + $suffix)).Path
          $takween = (Resolve-Path ("ecosystem/Takween/dist/bin/takween" + $suffix)).Path
          $generator = if ($IsWindows) { @('-G', 'MinGW Makefiles') } else { @() }
          cmake -S . -B build `
            -DBAA_LSP_BUILD_TESTS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            "-DBAA_LSP_BAA_EXECUTABLE=$baa" `
            "-DBAA_LSP_TAKWEEN_EXECUTABLE=$takween" `
            @generator

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install and smoke the packaged server
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/baa-lsp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $server = (Resolve-Path ("dist/baa-lsp/bin/baa-lsp" + $suffix)).Path
          $compiler = (Resolve-Path ("build/tests/baa_lsp_fake_compiler" + $suffix)).Path
          python tests/TestStdioProtocol.py $server $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            python tests/TestWindowsRuntime.py $server
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build standalone archive
        run: cmake --build build --config Release --target package

      - uses: actions/upload-artifact@v4
        with:
          name: Baa-LSP-${{ runner.os }}-x86_64
          path: build/Baa-LSP-0.1.0-*
          if-no-files-found: error
