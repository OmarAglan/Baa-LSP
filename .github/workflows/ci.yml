name: Baa-LSP CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa
          ref: 17c5dc31617a7976c2a7d4be30cf6e0faf13ab47
          path: ecosystem/Baa

      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f7fcf8f6d2bf629daf708b3b6028e22c74683ce6
          path: ecosystem/Nazm

      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Takween
          ref: d6a2c629d8a56d2d75c226820fb7a78810f75eae
          path: ecosystem/Takween

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Windows MinGW toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\msys64\ucrt64\bin\gcc.exe')) {
            throw 'The Windows runner does not provide the required UCRT64 MinGW toolchain.'
          }
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Baa and Nazm
        shell: pwsh
        run: |
          $generator = if ($IsWindows) { @('-G', 'MinGW Makefiles') } else { @() }
          cmake -S ecosystem/Baa -B ecosystem/Baa/build -DCMAKE_BUILD_TYPE=Release @generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S ecosystem/Nazm -B ecosystem/Nazm/build -DCMAKE_BUILD_TYPE=Release @generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          cmake --build ecosystem/Baa/build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ecosystem/Nazm/build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Takween with the pinned ecosystem tools
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baa = (Resolve-Path ("ecosystem/Baa/build/baa" + $suffix)).Path
          $nazm = (Resolve-Path ("ecosystem/Nazm/build/nazm" + $suffix)).Path
          $env:BAA_NAZM = $nazm
          $env:NAZM = $nazm
          ./ecosystem/Takween/scripts/build_takween.ps1 `
            -BaaPath $baa `
            -BaaStdlibPath (Resolve-Path 'ecosystem/Baa/stdlib').Path

      - name: Configure
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baa = (Resolve-Path ("ecosystem/Baa/build/baa" + $suffix)).Path
          $takween = (Resolve-Path ("ecosystem/Takween/dist/bin/takween" + $suffix)).Path
          $generator = if ($IsWindows) { @('-G', 'MinGW Makefiles') } else { @() }
          cmake -S . -B build `
            -DBAA_LSP_BUILD_TESTS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            "-DBAA_LSP_BAA_EXECUTABLE=$baa" `
            "-DBAA_LSP_TAKWEEN_EXECUTABLE=$takween" `
            @generator

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
